name: Verify Continuous Earth Globe
on:
  push:
    branches:
      - feat/cockpit-continuous-3d-earth-20261119
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Supersede obsolete validation runs when newer commits arrive on the same branch.
# GitHub Pages deployment uses its own non-cancelling concurrency group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  globe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:pages
      - name: Restore cached Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system libraries
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium browser if not cached
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config playwright.cockpit-globe.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-continuous-earth
          path: test-results/globe-3d-loaded.png
          if-no-files-found: ignore
