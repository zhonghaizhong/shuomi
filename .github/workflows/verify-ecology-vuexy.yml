name: Verify Ecology & Cockpit Unified Theme
on:
  push:
    branches:
      - fix/cockpit-hero-and-ecology-vuexy-20261119
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.ecology.config.ts
      - run: pnpm exec playwright test --config playwright.cockpit-globe.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecology-figma-comparison
          path: |
            test-results/ecology-*.png
            test-results/cockpit-hero-2560.png
            test-results/globe-3d-loaded.png
          if-no-files-found: ignore
