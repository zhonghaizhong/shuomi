name: Verify Premium Commerce and Topbar
on:
  push:
    branches:
      - fix/premium-commerce-topbar-interactions-20261119
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.premium.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-commerce-screenshots
          path: test-results/premium-*.png
          if-no-files-found: ignore
