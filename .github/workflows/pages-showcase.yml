name: GitHub Pages Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-showcase
  # Keep active builds running; replace superseded pending releases.
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build interactive static showcase
        run: pnpm run build:pages
      - name: Verify POD print images are included in Pages artifact
        run: |
          for image in butterfly-peony-original butterfly-peony-monochrome butterfly-peony-warm butterfly-peony-cluster; do
            test -s "dist-pages/assets/pod-prints/v1/${image}.webp"
            node -e 'const fs=require("node:fs");const b=fs.readFileSync(process.argv[1]);if(b.toString("ascii",0,4)!=="RIFF"||b.toString("ascii",8,12)!=="WEBP")process.exit(1)' "dist-pages/assets/pod-prints/v1/${image}.webp"
          done
      - name: Verify the archived single POD composite preview is published
        run: |
          test -s dist-pages/assets/pod-previews/v1/butterfly-peony-warm-sds-tee-black-s.webp
          node -e 'const fs=require("node:fs");const b=fs.readFileSync("dist-pages/assets/pod-previews/v1/butterfly-peony-warm-sds-tee-black-s.webp");if(b.toString("ascii",0,4)!=="RIFF"||b.toString("ascii",8,12)!=="WEBP")process.exit(1)'
      - name: Verify generated own-product gallery is included in Pages artifact
        run: |
          test -s dist-pages/assets/own-product-ai-demo/six-products-48-images.webp
          node -e "const fs=require('fs');const b=fs.readFileSync('dist-pages/assets/own-product-ai-demo/six-products-48-images.webp');if(b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP')process.exit(1)"
      - name: Verify all 30 photographic product previews are published
        run: |
          test "$(find dist-pages/assets/listing-ai-preview/approved -name '*.jpg' -type f | wc -l)" -eq 30
          node - <<'NODE'
          const fs = require("node:fs");
          const dir = "dist-pages/assets/listing-ai-preview/approved";
          const names = ["cream", "charger", "skillet", "ereader", "battery"];
          for (const kind of names) for (let i = 1; i <= 6; i++) {
            const name = `${kind}-${String(i).padStart(2,"0")}.jpg`;
            const bytes = fs.readFileSync(`${dir}/${name}`);
            if (bytes.length < 10000 || bytes[0] !== 255 || bytes[1] !== 216)
              throw new Error(`Invalid JPG preview: ${name}`);
          }
          NODE
      - name: Verify all sixteen selected-market product images are published
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          for (const [id, colors] of [["SMYX-DEMO-001", ["black","white"]], ["SMYX-DEMO-002", ["black","gray"]]]) for (const color of colors) for (let i=1;i<=4;i++) {
            const path = "dist-pages/assets/selected-market/"+id+"/"+color+"-0"+i+".png";
            const b=fs.readFileSync(path);
            if(b.length<10000 || b.subarray(0,8).toString("hex")!=="89504e470d0a1a0a" || b.readUInt32BE(16)!==b.readUInt32BE(20)) throw Error("Invalid square PNG: "+path);
          }
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  verify-sidebar:
    name: Verify sidebar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify sidebar on desktop and small screens
        run: pnpm exec playwright test --config playwright.sidebar.config.ts

  verify-interactions-1:
    name: Verify showcase interactions (shard 1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify showcase action dialogs and cross-module flows
        run: pnpm exec playwright test --config playwright.showcase-interactions.config.ts --shard=1/2
      - name: Upload theme audit and interaction failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-interactions-shard-1
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-interactions-2:
    name: Verify showcase interactions (shard 2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify showcase action dialogs and cross-module flows
        run: pnpm exec playwright test --config playwright.showcase-interactions.config.ts --shard=2/2
      - name: Upload theme audit and interaction failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-interactions-shard-2
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify-sidebar, verify-interactions-1, verify-interactions-2]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
