name: GitHub Pages Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-showcase
  # Keep the active deployment alive when other contributors push to main.
  # GitHub Actions will queue the most recent pending run instead of cancelling
  # every in-progress build before the website can be published.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build interactive static showcase
        run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium browser if cache is missing
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify sidebar on desktop and small screens
        run: pnpm exec playwright test --config playwright.sidebar.config.ts
      - name: Verify showcase action dialogs and cross-module flows
        run: pnpm exec playwright test --config playwright.showcase-interactions.config.ts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
