name: GitHub Pages Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-showcase
  # Keep active builds running; replace superseded pending releases.
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build interactive static showcase
        run: pnpm run build:pages
      - name: Verify generated own-product gallery is included in Pages artifact
        run: |
          test -s dist-pages/assets/own-product-ai-demo/six-products-48-images.webp
          node -e "const fs=require('fs');const b=fs.readFileSync('dist-pages/assets/own-product-ai-demo/six-products-48-images.webp');if(b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP')process.exit(1)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  verify-sidebar:
    name: Verify sidebar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify sidebar on desktop and small screens
        run: pnpm exec playwright test --config playwright.sidebar.config.ts

  verify-interactions-1:
    name: Verify showcase interactions (shard 1/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify showcase action dialogs and cross-module flows
        run: pnpm exec playwright test --config playwright.showcase-interactions.config.ts --shard=1/2
      - name: Upload theme audit and interaction failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-interactions-shard-1
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify-interactions-2:
    name: Verify showcase interactions (shard 2/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Verify showcase action dialogs and cross-module flows
        run: pnpm exec playwright test --config playwright.showcase-interactions.config.ts --shard=2/2
      - name: Upload theme audit and interaction failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-interactions-shard-2
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, verify-sidebar, verify-interactions-1, verify-interactions-2]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
