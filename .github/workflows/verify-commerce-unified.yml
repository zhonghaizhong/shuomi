name: Verify Data Store Plans Account Vuexy
on:
  push:
    branches:
      - feat/unify-data-store-plans-account-20261119
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  visual-and-behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.commerce-unified.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-unified-figma-visual-review
          path: test-results/unified-*.png
          if-no-files-found: ignore
